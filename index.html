<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/src/css/base.css" />
    <link rel="stylesheet" href="/src/css/custom.css" />
    <script src="/dist/app.js" defer type="module"></script>
  </head>
  <body>
    <div class="container">
      <div class="screen memory-game">
        <div class="game-header">
          <div class="title">Title</div>
        </div>
        <div class="game-ui">
          <div class="points-display-container" data-anim-dir="left">
            <div class="points-display" data-player="user">You: 0 points</div>
            <div class="score-ticker">+ 100 points</div>
          </div>
          <div class="points-display-container" data-anim-dir="right">
            <div class="points-display" data-player="computer">
              Computer: 0 points
            </div>
            <div class="score-ticker">+ 100 points</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
